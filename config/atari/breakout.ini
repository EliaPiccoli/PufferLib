[base]
package = atari
env_name = breakout
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 256
hidden_size = 256

[policy]
emb_size = 256
device = "cuda:0"

[train]
device = 'cuda:0'
total_timesteps = 11_297_140
batch_size = 16_384
minibatch_size = 512
update_epochs = 1
bptt_horizon = 8
learning_rate = 0.0003888563113148569
gae_lambda = 0.8935353540034277
gamma = 0.9450009745097376
ent_coef = 0.014510372204194016
clip_coef = 0.1594154589831051
vf_clip_coef = 0.08506087655135486
vf_coef = 0.4845014707608069
max_grad_norm = 0.18311676383018496

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024

[sweep.parameters.train.parameters.total_timesteps]
distribution = uniform
min = 5_000_000
max = 30_000_000