[base]
package = atari
env_name = pong
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 512
hidden_size = 512

[policy]
emb_size = 512
device = "cuda:3"

[train]
device = 'cuda:3'
total_timesteps = 5_775_949
batch_size = 32_768
minibatch_size = 512
update_epochs = 3
bptt_horizon = 8
learning_rate = 0.0002184745071355512
gae_lambda = 0.9284140766250926
gamma = 0.9677632893528788
ent_coef = 0.010817733926724173
clip_coef = 0.08254622180032753
vf_clip_coef = 0.14033393723769014
vf_coef = 0.4731632575645403
max_grad_norm = 0.29812508821487427

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024