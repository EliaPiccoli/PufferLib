[base]
package = atari
env_name = space_invaders
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 256
hidden_size = 256

[policy]
emb_size = 256
device = "cuda:3"

[train]
device = 'cuda:3'
total_timesteps = 7_500_000
batch_size = 65_536
minibatch_size = 4_096
update_epochs = 4
bptt_horizon = 8
learning_rate = 0.0012161186756094724
gae_lambda = 0.6957035398791592
gamma = 0.9925043678586688
ent_coef = 0.032082891906869346
clip_coef = 0.24504077831570073
vf_clip_coef = 0.18204547640437296
vf_coef = 0.5850012910005633
max_grad_norm = 0.6649078130722046

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024

[sweep.parameters.train.parameters.total_timesteps]
distribution = uniform
min = 5_000_000
max = 30_000_000