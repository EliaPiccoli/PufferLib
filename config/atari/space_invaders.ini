[base]
package = atari
env_name = space_invaders
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 128
hidden_size = 128

[policy]
emb_size = 128
device = "cuda:3"

[train]
device = 'cuda:3'
total_timesteps = 50_000_000
batch_size = 32_768
minibatch_size = 1024
update_epochs = 3
bptt_horizon = 16
learning_rate = 0.0006996288443466171
gae_lambda = 0.7185146353438537
gamma = 0.9465387405334326
ent_coef = 0.006809012107845459
clip_coef = 0.2524334879831033
vf_clip_coef = 0.16868181508974703
vf_coef = 0.4667091170554717
max_grad_norm = 0.6040177345275879

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024

[sweep.parameters.train.parameters.total_timesteps]
distribution = uniform
min = 5_000_000
max = 30_000_000