[base]
package = atari
env_name = enduro
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 128
hidden_size = 128

[policy]
emb_size = 128
device = "cuda:0"

[train]
device = "cuda:0"
total_timesteps = 60_000_000
batch_size = 32_768
minibatch_size = 1024
update_epochs = 2
bptt_horizon = 8
learning_rate = 0.0015088045137189648
gae_lambda = 0.9531391383313462
gamma = 0.9660452755846224
ent_coef = 0.004473813950139437
clip_coef = 0.16257338420006162
vf_clip_coef = 0.05797472053247653
vf_coef = 0.3401104504915891
max_grad_norm = 0.1247536838054657

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024

[sweep.parameters.env.parameters.frameskip]
distribution = uniform
min = 3
max = 10