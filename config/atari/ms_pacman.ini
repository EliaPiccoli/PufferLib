[base]
package = atari
env_name = ms_pacman
rnn_name = Recurrent
policy_name = WSASinglePolicy

[rnn]
input_size = 512
hidden_size = 512

[policy]
emb_size = 512
device = "cuda:1"

[train]
device = 'cuda:1'
total_timesteps = 30_096_640
batch_size = 16_384
minibatch_size = 512
update_epochs = 2
bptt_horizon = 8
learning_rate = 0.0012102404811550702
gae_lambda = 0.894571699486771
gamma = 0.96939434509051
ent_coef = 0.003645812091887106
clip_coef = 0.15481428031847908
vf_clip_coef = 0.10112837463820452
vf_coef = 0.6619733877685544
max_grad_norm = 0.4652574062347412

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024

[sweep.parameters.train.parameters.total_timesteps]
distribution = uniform
min = 5_000_000
max = 30_000_000