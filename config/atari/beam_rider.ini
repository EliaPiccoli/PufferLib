[base]
package = atari
env_name = beam_rider
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 512
hidden_size = 512

[policy]
emb_size = 512
device = "cuda:0"

[train]
device = 'cuda:0'
total_timesteps = 50_000_000
batch_size = 32_768
minibatch_size = 512
update_epochs = 1
bptt_horizon = 8
learning_rate = 0.0007092522997011639
gae_lambda = 0.7009726830017092
gamma = 0.9651232401265204
ent_coef = 0.008395319294996867
clip_coef = 0.18116385921610403
vf_clip_coef = 0.21580899060908337
vf_coef = 0.32987285334707117
max_grad_norm = 0.5877358913421631

[env]
frameskip = 4
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024
