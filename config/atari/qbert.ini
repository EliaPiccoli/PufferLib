[base]
package = atari
env_name = qbert
rnn_name = Recurrent
policy_name = WSAPolicy

[rnn]
input_size = 1024
hidden_size = 1024

[policy]
emb_size = 1024
device = "cuda:3"

[train]
device = 'cuda:3'
total_timesteps = 20_000_000
batch_size = 32_768
minibatch_size = 512
update_epochs = 3
bptt_horizon = 16
learning_rate = 0.003128382467505487
gae_lambda = 0.8116313052918205
gamma = 0.9383639932156232
ent_coef = 0.012489443096861206
clip_coef = 0.31967293987507417
vf_clip_coef = 0.06821107624272271
vf_coef = 0.5545012471160393
max_grad_norm = 0.3046135902404785

[env]
frameskip = 5
repeat_action_probability = 0.0

[sweep.parameters.policy.parameters.emb_size]
distribution = uniform
min = 128
max = 1024